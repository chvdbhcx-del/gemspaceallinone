# Builds Gemspace for Windows (Tauri, NSIS installer) and Android (APK) and, on main, publishes both
# to a GitHub release. Stable file names, so .../releases/latest/download/<name> always gives the newest.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GEMSPACE_BUILD: ${{ github.run_number }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - name: Tests and clippy
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build the installer
        run: npx --yes @tauri-apps/cli@2.12.6 build --ci --bundles nsis
      - name: Collect
        run: |
          mkdir -p ../out
          cp "$(ls target/release/bundle/nsis/*.exe | head -n1)" ../out/Gemspace-setup.exe
          ls -l ../out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: out/*
          retention-days: 7
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/app/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a throwaway key and will not install over an older one"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gemspace.jks"
          {
            echo "GEMSPACE_KEYSTORE=$RUNNER_TEMP/gemspace.jks"
            echo "GEMSPACE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Tests and APK
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Collect
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/Gemspace.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs ../out/Gemspace.apk | grep -E 'certificate (DN|SHA-256)' | tee -a "$GITHUB_STEP_SUMMARY" || true
          ls -l ../out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: out/*
          retention-days: 7
          if-no-files-found: error

  release:
    needs: [windows, android]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && sha256sum * > SHA256SUMS.txt && ls -l
          TAG="v0.1.0-build.${GEMSPACE_BUILD}"
          gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Gemspace 0.1.0, сборка ${GEMSPACE_BUILD}" \
            --notes "- \`Gemspace-setup.exe\`: Windows 10/11. Если SmartScreen ругается: «Подробнее» → «Выполнить в любом случае».
          - \`Gemspace.apk\`: Android 8+. Для нескольких аккаунтов нужен Android System WebView 128 или новее."
