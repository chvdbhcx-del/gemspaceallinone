<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemspace</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="rail">
  <button id="feed" class="tile feed-tile" title="Лента: новые сообщения всех аккаунтов" aria-label="Лента"><span class="ava"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 12h-4a3 3 0 0 1-6 0H5V5h14z"/></svg></span><span class="lbl">Лента</span></button>
  <div class="sep"></div>
  <div id="tiles"><span id="indicator"></span></div>
  <button id="add" class="tool" title="Добавить аккаунт" aria-label="Добавить аккаунт">+</button>
  <div class="spacer"></div>
  <button id="upd" class="tool upd" title="Доступно обновление" aria-label="Обновить Gemspace" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4h2v9.2l3.6-3.6 1.4 1.4-6 6-6-6 1.4-1.4 3.6 3.6zM5 18h14v2H5z"/></svg></button>
  <button id="gear" class="tool" title="Настройки" aria-label="Настройки"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
</nav>


<section id="overlay" hidden>
  <div class="sheet">
    <header><h1 id="ov-title"></h1><button id="ov-close" class="x" title="Закрыть">✕</button></header>
    <div id="ov-body"></div>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
