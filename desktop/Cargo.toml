[package]
name = "gemspace"
version = "0.1.0"
description = "Gemspace: all Gem Space accounts in one window"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "gemspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["unstable", "tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
# thin LTO with the default codegen units: the release build takes well under a minute in CI instead of
# 2.5 (fat LTO with one unit), for an installer only slightly larger
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
