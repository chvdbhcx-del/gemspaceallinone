[package]
name = "gemspace"
version = "0.1.0"
description = "Gemspace: all Gem Space accounts in one window"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "gemspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["unstable", "tray-icon", "image-png", "devtools"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# patched copy (vendor/): names the WebView2 profile of each account (lib.rs, shared browser)
tauri-runtime-wry = "2.12"

[target.'cfg(windows)'.dependencies]
# account pages without Edge's tracking prevention (lib.rs, no_tracking_prevention); same versions as wry uses
webview2-com = "0.39"
windows-core = "0.62"
# memory in use (lib.rs, memory_guard)
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[profile.release]
# thin LTO with the default codegen units: the release build takes well under a minute in CI instead of
# 2.5 (fat LTO with one unit), for an installer only slightly larger
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true

# Tauri's WebView2 runtime with one small addition: a WebView2 profile per webview (vendor/tauri-runtime-wry,
# search "Hovi Space patch"). Upgrading Tauri means copying the new version there and adding it again.
[patch.crates-io]
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry" }
