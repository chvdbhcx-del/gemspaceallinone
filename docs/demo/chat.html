<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Demo stand-in for web.gemspace.com in README screenshots, laid out like the real Gem Space web client
     but with made-up chats. ?phone = the narrow mobile layout (open chat only). -->
<link rel="stylesheet" href="chat.css">
</head><body>
<div class="app" id="app"></div>
<script>
// [name, color, time, preview, unread, active, muted]
const CHATS = [
  ['Ирина Морозова', '#ec407a', '12:41', 'Счёт получила, оплачу сегодня 👍', 2, 1],
  ['Опт: заявки', '#7e57c2', '12:30', '<b>Марк:</b> Нужно 40 коробок к пятнице', 5, 0, 1],
  ['Денис Карпов', '#26a69a', '11:58', 'Ок, жду трек-номер', 1],
  ['Ольга', '#ffa726', '11:20', 'Спасибо, всё пришло!'],
  ['Кафе «Терраса»', '#66bb6a', '10:05', 'Можно перенести доставку на среду?', 1],
  ['Сергей Лебедев', '#8d6e63', 'Вчера', '📷 Фото'],
  ['Склад, смена 2', '#3aa0ff', 'Вчера', '<b>Вы:</b> Отгрузка в 9:00'],
  ['Лиза', '#ef5350', 'Пн', 'Хорошо, договорились'],
  ['Бухгалтерия', '#5c6bc0', 'Пн', '📄 Акт сверки за октябрь.pdf'],
  ['Новости магазина', '#ff7043', 'Вс', 'Скидки недели уже на сайте', 0, 0],
];
const MSGS = [
  ['day', 'Сегодня'],
  ['them', 'Здравствуйте! Можно счёт на 12 позиций из вчерашнего списка?', '12:02'],
  ['me', 'Добрый день, Ирина! Сейчас пришлю.', '12:06'],
  ['me', '<div class="file"><span>PDF</span><div>Счёт №418.pdf<small>184 КБ</small></div></div>Оплата до пятницы.', '12:10'],
  ['them', 'А доставка в субботу возможна?', '12:31'],
  ['me', 'Да, в субботу с 10 до 14. Привезём всё одной машиной.', '12:35'],
  ['them', 'Отлично, тогда суббота', '12:40'],
  ['them', 'Счёт получила, оплачу сегодня 👍', '12:41'],
];
// outline icons, drawn for this demo
const P = {
  all: '<rect x="3" y="5" width="13" height="10" rx="3"/><path d="M8 18h8l4 3v-9a3 3 0 0 0-1-2"/>',
  chats: '<path d="M4 5h16v11H9l-5 4z"/>',
  channels: '<path d="M12 3l8 9-8 9-8-9z"/><path d="M8 12h8"/>',
  spaces: '<circle cx="12" cy="8" r="3"/><circle cx="5" cy="10" r="2"/><circle cx="19" cy="10" r="2"/><path d="M6 20a6 6 0 0 1 12 0M1.5 18a3.5 3.5 0 0 1 4-3M22.5 18a3.5 3.5 0 0 0-4-3"/>',
  catalog: '<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/>',
  phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/>',
  clip: '<path d="M16 7v9a4 4 0 0 1-8 0V6a2.5 2.5 0 0 1 5 0v9a1 1 0 0 1-2 0V7"/>',
  smile: '<circle cx="12" cy="12" r="9"/><path d="M8 14a5 5 0 0 0 8 0M9 9.5h.01M15 9.5h.01"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  back: '<path d="M20 12H5M11 5l-7 7 7 7"/>',
};
const ic = (n, cls = '') => `<span class="ic ${cls}"><svg viewBox="0 0 24 24">${P[n]}</svg></span>`;
const more = '<span class="ic f"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></span>';
const nv = (n, t, on) => `<div class="nv${on ? ' on' : ''}"><svg viewBox="0 0 24 24">${P[n]}</svg>${t}</div>`;
const ini = (n) => n.replace(/[«»:,]/g, '').split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
// a faint doodle wallpaper behind the messages, like a messenger background
const doodle = (() => {
  const shapes = [P.chats, P.bell, P.phone, P.smile, P.clip, P.search, P.mic, P.channels];
  let g = '';
  for (let i = 0; i < 24; i++) {
    const x = (i % 6) * 57 + (Math.floor(i / 6) % 2) * 28, y = Math.floor(i / 6) * 85 + 10, r = (i * 47) % 60 - 30;
    g += `<g transform="translate(${x} ${y}) rotate(${r} 12 12) scale(1.1)">${shapes[i % shapes.length]}</g>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="340" height="340" viewBox="0 0 340 340" fill="none" stroke="${matchMedia("(prefers-color-scheme: light)").matches ? "#000000" : "#ffffff"}" stroke-opacity="${matchMedia("(prefers-color-scheme: light)").matches ? ".06" : ".05"}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${g}</svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
})();
document.documentElement.style.setProperty('--doodle', doodle);
const phone = location.search.includes('phone');
if (phone) document.body.classList.add('phone');
// ?focus: «Все чаты» is open next to the page, the page shows only the open chat (shared/chats.js __gemspaceFocus)
if (location.search.includes('focus')) document.body.classList.add('focus');
const list = CHATS.map(([n, c, t, p, u, on, mute]) => `<div class="item${on ? ' on' : ''}"><div class="av" style="background:${c}">${ini(n)}</div>
  <div class="meta"><div class="row"><span class="name">${n}</span><span class="time">${t}</span></div>
  <div class="row"><span class="prev">${p}</span>${u ? `<span class="cnt${mute ? ' mute' : ''}">${u}</span>` : ''}</div></div></div>`).join('');
const msgs = MSGS.map(([k, x, t]) => k === 'day' ? `<span class="day">${x}</span>`
  : `<div class="b ${k}">${x}<i>${t}${k === 'me' ? ' ✓✓' : ''}</i></div>`).join('');
const gem = '<svg viewBox="0 0 24 24"><path d="M7 4h10l4 5-9 11L3 9z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg>';
document.getElementById('app').innerHTML = `
<div class="nav"><div class="logo">${gem}</div>${nv('all', 'Все', 1)}${nv('chats', 'Чаты')}${nv('channels', 'Каналы')}<div class="nsep"></div>${nv('spaces', 'Spaces')}<span class="sp"></span><div class="nsep"></div>${nv('catalog', 'Каталог')}</div>
<div class="list"><div class="top"><div class="search">Поиск</div><div class="self">П</div></div>${list}
  <div class="fab"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></div></div>
<div class="chat"><div class="head">${phone ? ic('back') : ''}<div class="av" style="background:#ec407a">ИМ</div>
  <div><b>Ирина Морозова</b><small>в сети</small></div><span class="sp"></span>${phone ? '' : ic('search')}${ic('phone')}${phone ? '' : ic('bell')}${more}</div>
  <div class="msgs">${msgs}</div>
  <div class="input">${ic('clip')}<div class="field"><span class="sp">Напишите сообщение...</span>${ic('smile')}</div>${ic('mic')}</div></div>
<span class="demo">демо</span>`;
</script></body></html>
