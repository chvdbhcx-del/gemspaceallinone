<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemspace Android demo</title>
<!-- Replica of the Android app's account strip (MainActivity.render) for screenshots; the page below is a demo chat. -->
<style>
:root{--bar:#e6eaee;--fg:#17212b;--muted:#5d6b78;--line:#c9d2da}
html,body{margin:0;height:100%;font:14px/1.4 Roboto,"Segoe UI",system-ui,sans-serif;background:var(--bar);color:var(--fg);overflow:hidden}
.status{height:28px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:13px;font-weight:600}
.bar{display:flex;align-items:center;padding:4px 6px}
.strip{flex:1;display:flex;overflow:hidden}
.tile{position:relative;width:58px;height:60px;flex:none}
.ava{position:absolute;left:9px;top:2px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;box-sizing:border-box}
.on .ava{border:3px solid var(--fg)}
.sleep .ava{opacity:.55}
.lbl{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.on .lbl{color:var(--fg)}
.badge{position:absolute;right:4px;top:0;min-width:18px;height:18px;border-radius:9px;background:#3aa0ff;color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;box-sizing:border-box;border:2px solid var(--bar)}
.dot{position:absolute;right:8px;top:0;width:10px;height:10px;border-radius:50%;background:#3aa0ff;border:2px solid var(--bar)}
.tool{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:20px;color:var(--muted);margin-left:2px;flex:none}
iframe{border:0;width:100%;height:calc(100% - 96px);display:block}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center}
.dlg{background:#fff;border-radius:6px;width:300px;padding:22px 22px 10px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.dlg h3{margin:0 0 12px;font-size:19px;font-weight:500}
.dlg .in{border-bottom:2px solid #3aa0ff;padding:8px 0;font-size:16px}
.cs{display:flex;gap:6px;padding:14px 0 6px}.cs span{width:30px;height:30px;border-radius:50%;box-sizing:border-box}
.cs .sel{border:3px solid var(--fg)}
.btns{display:flex;justify-content:flex-end;gap:18px;padding:14px 0 6px;color:#3aa0ff;font-weight:600;text-transform:uppercase;font-size:13px}
</style></head><body>
<div class="status"><span>12:42</span><span>▲ ▮ 87%</span></div>
<div class="bar"><div class="strip" id="strip"></div><div class="tool">+</div><div class="tool">⚙</div></div>
<iframe src="chat-phone.html"></iframe>
<div class="scrim" id="scrim"><div class="dlg"><h3>Новый аккаунт</h3><div class="in">Розница</div>
<div class="cs"><span style="background:#3aa0ff"></span><span style="background:#26a69a"></span><span style="background:#7e57c2"></span><span style="background:#ef5350"></span><span class="sel" style="background:#ffa726"></span><span style="background:#66bb6a"></span><span style="background:#ec407a"></span></div>
<div class="btns"><span>Отмена</span><span>Добавить и войти</span></div></div></div>
<script>
const A=[['Продажи','#3aa0ff',4,0,1,1],['Поддержка','#26a69a',12,0,0,1],['Опт','#7e57c2',0,1,0,1],['Магазин','#ffa726',2,0,0,1],['Доставка','#ef5350',0,0,0,0],['Анна К.','#ec407a',0,0,0,0]];
const s=document.getElementById('strip');
for(const [n,c,u,att,on,awake] of A){const t=document.createElement('div');t.className='tile'+(on?' on':'')+(awake?'':' sleep');
const i=n.trim().split(/\s+/);t.innerHTML=`<div class="ava" style="background:${c}">${(i[0][0]+(i[1]?i[1][0]:'')).toUpperCase()}</div><div class="lbl">${n}</div>`+(u?`<div class="badge">${u}</div>`:att?'<div class="dot"></div>':'');s.appendChild(t)}
if(location.search.includes('dialog'))document.getElementById('scrim').style.display='flex';
</script></body></html>
